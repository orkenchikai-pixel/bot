# Запуск на сервере: агент + Caddy (автоматический HTTPS-сертификат Let's Encrypt).
# Проще всего — мастером установки (install.sh): он сам заполнит .env, создаст файл клиники
# в clinics.local/ и запустит всё. Вручную:
#   1. Направьте DNS-запись домена (A) на IP сервера.
#   2. В .env укажите DOMAIN=bot.ваш-домен.kz и остальные секреты.
#   3. mkdir -p data && sudo chown 1000:1000 data   (бот в контейнере работает не от root)
#   4. docker compose up -d --build
# Агент наружу не открыт — к нему ходит только Caddy по внутренней сети.
services:
  agent:
    build: .
    image: dental-bot-agent:local
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
    volumes:
      - ./data:/app/data
      # Файлы клиник. Мастер установки кладёт их в clinics.local (CLINICS_HOST_DIR в .env), чтобы
      # обновления кода их не трогали. Прайс и расписание правятся без пересборки: dental-bot edit
      - ${CLINICS_HOST_DIR:-./clinics}:/app/clinics:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2
    depends_on:
      - agent
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Укажите DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
