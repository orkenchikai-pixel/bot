name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверка типов
        run: npm run typecheck
      - name: Тесты с покрытием
        run: npm run test:coverage
      - name: Уязвимости в зависимостях
        run: npm audit --audit-level=high
      - name: Сборка
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Сборка Docker-образа
        run: docker build -t dental-crm-agent:ci .
